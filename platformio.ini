; Freestar Dash I/O Box (iobox3) — MS2/Extra I/O box firmware
;
; ESP32 WROOM-32 module on the v3 board. Reads the MicroSquirt MS2/Extra outpc
; realtime broadcast over ESP-NOW (the CAN transceiver is gone), and drives:
;   - 7 ULN2003A outputs O1-O7 = 13,12,14,27,26,25,23
;   - fan relay through one of those outputs ('Y <n>' repoints it)
;   - IAC PWM on GPIO19 (MOSFET gate)
;   - warning buzzer on GPIO32
;
; Inputs (pin map LOCKED 2026-08-09):
;   A1/A2/A3 = 36,39,34 — PC817C OPTOCOUPLERS since the V2 board (2026-10-15),
;             ACTIVE-LOW digital. No threshold, no hysteresis, no ADC.
;   A4       = 35      — the only analog channel left: fuel sender divider.
;   CAN TX/RX pins 5/4 are free; GPIO5 is the 3-wire Hall speed input (PCNT).
;
; The two GC9A01A round displays were removed from the box on 2026-10-19 and
; their code was removed on 2026-10-21, so the Adafruit GFX / GC9A01A libraries
; are no longer dependencies. GPIO2/15/16/17/18/21 are free.
;
; A second firmware, freestar_pdb, targets the SAME PCB with this same pin map.

[env:esp32dev]
platform = espressif32@7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
; Pin arduino core 2.0.17: the shared framework package gets replaced by the
; dash project's pioarduino core 3.3.11 (ledcSetup/ledcAttachPin are core-2 API).
platform_packages =
	platformio/framework-arduinoespressif32 @ ~3.20017.0
build_flags =
	-DCORE_DEBUG_LEVEL=0
	-Wall
	-Wextra
	-Wno-unused-parameter
	-Wno-unused-function
